<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
{% seo %}
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f85589">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
  </head>
  <body>
    <a id="skip-to-content" href="#content">Skip to the content.</a>

    <header class="page-header" role="banner">
      <div class="page-header__inner">
        <div class="project-name">{{ site.title }}</div>
        <div class="project-tagline">{{ site.tagline }}</div>
        <nav class="page-nav" aria-label="Primary">
          <a href="#product-prototyping-and-engineering">Hardware</a>
          <a href="#software-and-embedded-systems-development">Software</a>
          <a href="#advanced-manufacturing">Manufacturing</a>
          <a href="#high-performance-computing-and-systems-infrastructure">Infrastructure</a>
          <a href="https://github.com/coelacant1?tab=repositories" target="_blank" rel="noopener">GitHub</a>
        </nav>
      </div>
    </header>


    <main id="content" class="main-content" role="main">
      {{ content }}

      <footer class="site-footer">
        <span class="site-footer-credits">© 2026 - All Rights Reserved.</span>
        <span class="site-footer-sep"> · </span>
        <a class="site-footer-link" href="https://github.com/coelacant1?tab=repositories" target="_blank" rel="noopener">GitHub</a>
        <span class="site-footer-sep"> · </span>
        <a class="site-footer-link" href="https://github.com/coelacant1/coela.dev" target="_blank" rel="noopener">Site Source</a>
        <br>
        <br>
      </footer>
    </main>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        let ytGlobalIndex = 0;
        
        document.querySelectorAll('.mini-gallery').forEach(gallery => {
          const slides = gallery.querySelectorAll('.slide');
          const thumbs = gallery.querySelectorAll('.thumb');
          const prev   = gallery.querySelector('.nav.prev');
          const next   = gallery.querySelector('.nav.next');
          const captionEl    = gallery.querySelector('.slide-caption');
          let current  = 0;

          const loadMedia = node => {
            const img = node.querySelector('img[data-src]');
            if (img && !img.src) img.src = img.dataset.src;

            const vid = node.querySelector('iframe[data-src][allowfullscreen]');
            if (vid && !vid.src) vid.src = vid.dataset.src;

            const pdf = node.querySelector('iframe[data-src][data-type="pdf"]');
            if (pdf && !pdf.src) pdf.src = pdf.dataset.src;
          };

          function showSlide(idx) {
            const oldSlide = slides[current];
            if (oldSlide.dataset.type === 'video') {
              const player = oldSlide.querySelector('iframe');
              player.contentWindow.postMessage(
                JSON.stringify({ event: 'command', func: 'pauseVideo', args: [] }),
                '*'
              );
            }

            slides[current].classList.remove('active');
            thumbs[current].classList.remove('active');
            current = (idx + slides.length) % slides.length;
            slides[current].classList.add('active');
            thumbs[current].classList.add('active');
            
            const text = slides[current].dataset.caption || '';
            captionEl.textContent = text;

            loadMedia(slides[current]);
          }

          prev.addEventListener('click', () => showSlide(current - 1));
          next.addEventListener('click', () => showSlide(current + 1));
          thumbs.forEach(thumb => {
            thumb.addEventListener('click', () => {
              showSlide(parseInt(thumb.dataset.index, 10));
            });
          });

          showSlide(0)
        });

        document.querySelectorAll(".project-details").forEach(details => {
          // No-op: hover/click affordance is now handled in CSS via :hover and the open attribute.
        });
      });
    </script>
  </body>
</html>
